name: Build kernel (KSN legacy + SUSFS + selinux_hide) & WIFI

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: 'URL of the kernel source repository'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_oneplus_sm8150'
      kernel_branch:
        description: 'Branch of the kernel source (lineage-22.1 == 4.14.356)'
        required: true
        default: 'lineage-22.1'
      kernel_defconfig:
        description: 'defconfig file to use'
        required: true
        default: 'lineage_sm8150_defconfig'
      output_name:
        description: 'Name of the output.zip'
        required: false
        default: 'OP7_KSN_selinuxhide_wifi'
  push:
    branches:
      - oneplus/OOS_SM8150_11.0
  pull_request:
    branches:
      - oneplus/OOS_SM8150_11.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
      KERNEL_DEFCONFIG: ${{ github.event.inputs.kernel_defconfig || 'lineage_sm8150_defconfig' }}
      KERNEL_SOURCE_URL: ${{ github.event.inputs.kernel_source_url || 'https://github.com/LineageOS/android_kernel_oneplus_sm8150' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.1' }}
      OUTPUT_ZIP_NAME: ${{ github.event.inputs.output_name || 'OP7_KSN_selinuxhide_wifi' }}
      # SUSFS (kernel-4.14) integration
      SUSFS_SOURCE: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.14"
      SUSFS_KVER: "4.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Kernel Source
      # clone into ./kernel to keep paths stable for subsequent steps
        run: |
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_SOURCE_URL}" kernel
          cd kernel
          git submodule update --init --recursive
          cd ..

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Cleanup space
        run: |
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "/usr/local/share/boost" || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Install dependencies (LLVM 18 + cross-binutils)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang-18 llvm-18 lld-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils \
            make python3 libssl-dev libelf-dev build-essential bc bison flex unzip \
            ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs patch
          git clone https://github.com/khalidaboelmagd/AnyKernel3
          rm -rf AnyKernel3/.git

      - name: Get Version
        id: get_version
        run: |
          cd kernel
          git fetch --unshallow || true
          COUNT=$(git rev-list --count HEAD)
          echo "VERSION=$(expr ${COUNT:-0} + 10200)" >> $GITHUB_OUTPUT
          cd ..

      # ------------------------------------------------------------------
      # KernelSU-Next LEGACY branch (v3.3.0+): correct for 4.14 non-GKI and
      # contains kernel/feature/selinux_hide.c. The `legacy` positional arg
      # makes setup.sh `git checkout legacy` inside the KernelSU-Next clone.
      # This ALSO symlinks drivers/kernelsu -> KernelSU-Next/kernel and edits
      # drivers/Makefile + drivers/Kconfig automatically, so it MUST run
      # BEFORE the SUSFS patch steps below.
      # ------------------------------------------------------------------
      - name: KernelSU-Next setup (legacy)
        working-directory: ./kernel
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          echo "==== KernelSU-Next checkout ===="
          if [ -d KernelSU-Next ]; then
            git -C KernelSU-Next log -1 --oneline || true
          fi
          echo "==== confirm selinux_hide.c present ===="
          test -f KernelSU-Next/kernel/feature/selinux_hide.c
          echo "selinux_hide.c OK"

      # ------------------------------------------------------------------
      # SUSFS (kernel-4.14) integration.
      #
      # Only the kernel-side patch (50_add_susfs_in_kernel-4.14.patch) is
      # applied. The KernelSU-side patch (10_enable_susfs_for_ksu.patch) is
      # DELIBERATELY NOT applied: it targets the classic flat tiann/KernelSU
      # kernel/ layout (kernel/core_hook.c, kernel/ksud.c, kernel/allowlist.c,
      # kernel/throne_tracker.c, ...). The KernelSU-Next *legacy* branch used
      # here has a refactored layout (kernel/core/, kernel/feature/,
      # kernel/hook/, ...) where 16 of the 18 files the 10-patch touches do not
      # exist, so it can only ever "can't find file to patch" / .rej. See the
      # separate "Enable KSU_SUSFS Kconfig..." step which injects just the
      # Kconfig symbols the 50-patch #ifdef guards need.
      # ------------------------------------------------------------------
      - name: Clone SUSFS
        run: |
          git clone --depth=1 --branch "${SUSFS_BRANCH}" "${SUSFS_SOURCE}" susfs4ksu

      - name: Apply SUSFS patches (kernel-4.14)
        working-directory: ./kernel
        run: |
          set -euo pipefail
          # 1) Copy SUSFS sources into the kernel tree
          #    (include/linux/susfs_def.h defines INODE_STATE_SUS_KSTAT = BIT(26))
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          test -f include/linux/susfs_def.h || { echo "FATAL: susfs_def.h missing after copy"; exit 1; }
          grep -q 'INODE_STATE_SUS_KSTAT' include/linux/susfs_def.h \
            || { echo "FATAL: INODE_STATE_SUS_KSTAT not defined in susfs_def.h"; exit 1; }

          # 2) Apply the main kernel-side SUSFS patch.
          #    NOTE: hunk #1 of the fs/proc/task_mmu.c diff (the
          #    '#include <linux/susfs_def.h>' block near line 19) FAILS on
          #    lineage-22.1 because LineageOS added '#include <linux/ctype.h>'
          #    right after '#include <linux/mm_inline.h>', which perturbs the
          #    trailing context the hunk needs. Hunks #2/#3 (which reference
          #    INODE_STATE_SUS_KSTAT) still apply, so without the include the
          #    build fails with "use of undeclared identifier
          #    'INODE_STATE_SUS_KSTAT'". We let patch run, then repair the one
          #    missing include manually just below (idempotent, grep-guarded).
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-${SUSFS_KVER}.patch ./
          patch -p1 < 50_add_susfs_in_kernel-${SUSFS_KVER}.patch || true

          # 3) Repair the failed task_mmu.c hunk #1: inject the susfs_def.h
          #    include after <linux/mm_inline.h> if it is not already present.
          #    This is the exact intent of the rejected hunk and makes
          #    INODE_STATE_SUS_KSTAT visible to fs/proc/task_mmu.c.
          if ! grep -q '#include <linux/susfs_def.h>' fs/proc/task_mmu.c; then
            sed -i '/#include <linux\/mm_inline.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux\/susfs_def.h>\n#endif' fs/proc/task_mmu.c
            echo "[susfs] injected susfs_def.h include into fs/proc/task_mmu.c"
          else
            echo "[susfs] susfs_def.h already included in fs/proc/task_mmu.c"
          fi
          # Hard gate: the include MUST be present now, or the build will fail
          # the same way. Fail loudly here instead of 30 min into the compile.
          grep -q '#include <linux/susfs_def.h>' fs/proc/task_mmu.c \
            || { echo "FATAL: susfs_def.h include still missing from task_mmu.c"; exit 1; }
          echo "==== task_mmu.c include region ===="
          sed -n '19,26p' fs/proc/task_mmu.c

      # ------------------------------------------------------------------
      # KSU_SUSFS Kconfig symbols. The 50-patch guards every SUSFS code path
      # with #ifdef CONFIG_KSU_SUSFS_SUS_* . On the classic layout those
      # symbols come from 10_enable_susfs_for_ksu.patch, which we do NOT apply
      # (incompatible layout, see above). We add just the Kconfig menu to the
      # KernelSU-Next legacy kernel/Kconfig so CONFIG_KSU_SUSFS and its
      # sub-options exist and can be turned on by the defconfig fragment.
      # Idempotent: only appended if KSU_SUSFS is not already declared.
      # ------------------------------------------------------------------
      - name: Enable KSU_SUSFS Kconfig (legacy layout)
        working-directory: ./kernel
        run: |
          set -euo pipefail
          KSU_KCFG="KernelSU-Next/kernel/Kconfig"
          test -f "${KSU_KCFG}" || { echo "FATAL: ${KSU_KCFG} not found"; exit 1; }
          if grep -q 'config KSU_SUSFS' "${KSU_KCFG}"; then
            echo "[susfs] KSU_SUSFS Kconfig already present; skipping"
          else
            # Append a self-contained SUSFS Kconfig menu at EOF. It sits after
            # the "KernelSU" menu's endmenu (own menu, own endmenu) which is
            # valid Kconfig; only symbol existence matters for the 50-patch
            # #ifdef guards. Written column-0 via a quoted heredoc so Kconfig
            # `config`/`menu` keywords are not indented.
            cat >> "${KSU_KCFG}" <<'KCFG'

          menu "KernelSU - SUSFS"

          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS"
          	depends on KSU
          	default y

          config KSU_SUSFS_SUS_PATH
          	bool "Enable to hide suspicious path"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MOUNT
          	bool "Enable to hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_KSTAT
          	bool "Enable to spoof suspicious kstat"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_TRY_UMOUNT
          	bool "Enable try_umount"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_UNAME
          	bool "Enable to spoof uname"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable susfs kernel logging"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Enable open redirect"
          	depends on KSU_SUSFS
          	default y

          endmenu
          KCFG
            echo "[susfs] appended KSU_SUSFS Kconfig menu"
          fi
          echo "==== KSU_SUSFS Kconfig symbols ===="
          grep -n 'config KSU_SUSFS' "${KSU_KCFG}" || true

      # Patch 1: arch/arm64/mm/hugetlbpage.c (declare ptep, guard huge_pmd_share) via pattern (idempotent)
      - name: Apply hugetlbpage fix patch
        working-directory: kernel
        run: |
          set -euo pipefail
          if ! grep -q 'pte_t \*ptep' arch/arm64/mm/hugetlbpage.c; then
            sed -i '/pte_t \*pte = NULL;/a \  pte_t *ptep = NULL;' arch/arm64/mm/hugetlbpage.c || true
          fi
          sed -i 's/ptep = huge_pmd_share(mm, vma, addr, pud);/if (!ptep) ptep = huge_pmd_share(mm, vma, addr, pud);/' arch/arm64/mm/hugetlbpage.c || true
          echo "[hugetlbpage] sanity:"
          grep -n 'ptep' arch/arm64/mm/hugetlbpage.c || true

      # Patch 2: mm/huge_memory.c try_to_unmap API shim (add NULL 3rd arg)
      - name: Apply huge_memory try_to_unmap signature patch
        working-directory: kernel
        run: |
          set -euo pipefail
          sed -i 's/try_to_unmap(page, ttu_flags);/try_to_unmap(page, ttu_flags, NULL);/g' mm/huge_memory.c || true

      # Patch 3: fs/proc/task_mmu.c fix split_huge_pmd(vma, addr, pmd) -> (vma, pmd, addr)
      - name: Fix split_huge_pmd call order
        working-directory: kernel
        run: |
          set -euo pipefail
          sed -i 's/split_huge_pmd(vma, addr, pmd);/split_huge_pmd(vma, pmd, addr);/' fs/proc/task_mmu.c || true

      # ------------------------------------------------------------------
      # Inject KSU / SUSFS / selinux_hide / vermagic config into the defconfig
      # BEFORE seeding .config so olddefconfig keeps them. This is the block
      # that preserves the WiFi vermagic and enables the selinux_hide toggle.
      # ------------------------------------------------------------------
      - name: Inject KSU + SUSFS + vermagic defconfig fragment
        working-directory: kernel
        run: |
          set -euo pipefail
          DEFCFG="arch/arm64/configs/${KERNEL_DEFCONFIG}"
          echo "Appending config fragment to ${DEFCFG}"
          cat >> "${DEFCFG}" <<'EOF'
          # --- KernelSU-Next (legacy) + SUSFS + selinux_hide ---
          # legacy branch needs hooks: enable KPROBES so KSU uses kprobes syscall
          # hooks (no manual source patch) + full selinux_hide (incl. avc kprobe).
          # Manual hook must be OFF (KSU_KPROBES_HOOK depends on !KSU_MANUAL_HOOK).
          CONFIG_KPROBES=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_KPROBES_HOOK=y
          # --- Preserve WiFi vermagic: 4.14.356-perf-g040f6e737afe SMP preempt mod_unload modversions aarch64 ---
          CONFIG_LOCALVERSION="-perf-g040f6e737afe"
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_SMP=y
          CONFIG_PREEMPT=y
          EOF
          echo "==== tail of defconfig ===="
          tail -n 20 "${DEFCFG}"

      # 1) Seed .config into O=out
      - name: Prepare kernel output directory (defconfig)
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          export HOSTCC=clang-18
          export HOSTCXX=clang++-18
          mkdir -p out
          make O=out ARCH=arm64 ${KERNEL_DEFCONFIG}

      # 2) Non-interactive finalize + hard enforcement to avoid prompts and API skews
      - name: Finalize kernel config (non-interactive + enforce)
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH

          # Preseed defaults for all known prompts and disable problematic subsystems.
          # NOTE (vermagic): LOCALVERSION is forced to the vendor string and
          # LOCALVERSION_AUTO is disabled so no "+"/git-sha suffix is appended.
          cat > ../ci.defaults <<'EOF'
          CONFIG_QTI_GVM=n
          CONFIG_NR_CPUS=8
          CONFIG_HUGETLB_PAGE=n
          CONFIG_HUGETLBFS=n
          CONFIG_TRANSPARENT_HUGEPAGE=n
          CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=n
          CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=n
          CONFIG_KSM=n
          CONFIG_BTRFS_FS=n
          CONFIG_BTRFS_FS_POSIX_ACL=n
          CONFIG_TASKSTATS=n
          CONFIG_TASK_DELAY_ACCT=n
          CONFIG_TASK_XACCT=n
          CONFIG_TASK_IO_ACCOUNTING=n
          CONFIG_NFS_FS=n
          CONFIG_NFS_V4=n
          CONFIG_LOCKD=n
          CONFIG_SUNRPC=n
          CONFIG_COMPILE_TEST=n
          CONFIG_LOCALVERSION="-perf-g040f6e737afe"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_SMP=y
          CONFIG_PREEMPT=y
          CONFIG_KPROBES=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KSU_MANUAL_HOOK=n
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_KPROBES_HOOK=y
          CONFIG_KERNEL_GZIP=y
          CONFIG_KERNEL_BZIP2=n
          CONFIG_KERNEL_LZMA=n
          CONFIG_KERNEL_XZ=n
          CONFIG_KERNEL_LZO=n
          CONFIG_KERNEL_LZ4=n
          CONFIG_CROSS_COMPILE="aarch64-linux-gnu-"
          EOF

          make O=out ARCH=arm64 olddefconfig KCONFIG_ALLCONFIG=../ci.defaults

          # scripts/config enforcement if available (sed fallback below)
          if [ -x scripts/config ]; then
            ./scripts/config --file out/.config \
              --disable CONFIG_QTI_GVM \
              --set-val CONFIG_NR_CPUS 8 \
              --disable CONFIG_HUGETLB_PAGE --disable CONFIG_HUGETLBFS \
              --disable CONFIG_TRANSPARENT_HUGEPAGE --disable CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS --disable CONFIG_TRANSPARENT_HUGEPAGE_MADVISE \
              --disable CONFIG_KSM \
              --disable CONFIG_BTRFS_FS --disable CONFIG_BTRFS_FS_POSIX_ACL \
              --disable CONFIG_TASKSTATS --disable CONFIG_TASK_DELAY_ACCT --disable CONFIG_TASK_XACCT --disable CONFIG_TASK_IO_ACCOUNTING \
              --disable CONFIG_NFS_FS --disable CONFIG_NFS_V4 --disable CONFIG_LOCKD --disable CONFIG_SUNRPC \
              --disable CONFIG_COMPILE_TEST \
              --set-str CONFIG_LOCALVERSION "-perf-g040f6e737afe" --disable CONFIG_LOCALVERSION_AUTO \
              --enable CONFIG_MODVERSIONS --enable CONFIG_MODULE_UNLOAD \
              --enable CONFIG_SMP --enable CONFIG_PREEMPT \
              --enable CONFIG_KPROBES --enable CONFIG_KALLSYMS_ALL --disable CONFIG_KSU_MANUAL_HOOK \
              --enable CONFIG_KSU --enable CONFIG_KSU_SUSFS --enable CONFIG_KSU_KPROBES_HOOK \
              --enable CONFIG_KERNEL_GZIP \
              --disable CONFIG_KERNEL_BZIP2 --disable CONFIG_KERNEL_LZMA --disable CONFIG_KERNEL_XZ --disable CONFIG_KERNEL_LZO --disable CONFIG_KERNEL_LZ4 || true
          fi

          # Sed fallback to ensure enforcement
          sed -i 's/^CONFIG_BTRFS_FS=m/CONFIG_BTRFS_FS=n/' out/.config
          for s in CONFIG_BTRFS_FS_POSIX_ACL CONFIG_TASKSTATS CONFIG_TASK_DELAY_ACCT CONFIG_TASK_XACCT CONFIG_TASK_IO_ACCOUNTING CONFIG_NFS_FS CONFIG_NFS_V4 CONFIG_LOCKD CONFIG_SUNRPC CONFIG_HUGETLB_PAGE CONFIG_HUGETLBFS CONFIG_TRANSPARENT_HUGEPAGE CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS CONFIG_TRANSPARENT_HUGEPAGE_MADVISE CONFIG_KSM CONFIG_COMPILE_TEST; do
            sed -i "s/^${s}=.*/${s}=n/" out/.config
          done
          sed -i 's/^# CONFIG_NR_CPUS is not set$/CONFIG_NR_CPUS=8/' out/.config
          sed -i 's/^CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' out/.config
          sed -i 's/^CONFIG_KERNEL_GZIP=.*/CONFIG_KERNEL_GZIP=y/' out/.config
          for c in CONFIG_KERNEL_BZIP2 CONFIG_KERNEL_LZMA CONFIG_KERNEL_XZ CONFIG_KERNEL_LZO CONFIG_KERNEL_LZ4; do
            sed -i "s/^${c}=.*/${c}=n/" out/.config
          done
          if ! grep -q '^CONFIG_CROSS_COMPILE=' out/.config; then
            echo 'CONFIG_CROSS_COMPILE="aarch64-linux-gnu-"' >> out/.config
          else
            sed -i 's/^CONFIG_CROSS_COMPILE=.*/CONFIG_CROSS_COMPILE="aarch64-linux-gnu-"/' out/.config
          fi

          # --- vermagic hard-enforcement (WiFi-critical) ---
          # Force LOCALVERSION and kill LOCALVERSION_AUTO so vermagic base == 4.14.356-perf-g040f6e737afe
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf-g040f6e737afe"/' out/.config
          if ! grep -q '^CONFIG_LOCALVERSION=' out/.config; then
            echo 'CONFIG_LOCALVERSION="-perf-g040f6e737afe"' >> out/.config
          fi
          sed -i 's/^CONFIG_LOCALVERSION_AUTO=.*/# CONFIG_LOCALVERSION_AUTO is not set/' out/.config
          if ! grep -q 'CONFIG_LOCALVERSION_AUTO' out/.config; then
            echo '# CONFIG_LOCALVERSION_AUTO is not set' >> out/.config
          fi
          # SMP / PREEMPT / MODVERSIONS / MODULE_UNLOAD are part of vermagic -> force =y
          for e in CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD CONFIG_SMP CONFIG_PREEMPT CONFIG_MODULES; do
            sed -i "s/^# ${e} is not set/${e}=y/" out/.config
            sed -i "s/^${e}=.*/${e}=y/" out/.config
            grep -q "^${e}=y" out/.config || echo "${e}=y" >> out/.config
          done
          # Disable manual hook, then force KPROBES / KALLSYMS_ALL / KSU / SUSFS / kprobes-hook =y
          sed -i 's/^CONFIG_KSU_MANUAL_HOOK=y/# CONFIG_KSU_MANUAL_HOOK is not set/' out/.config
          for e in CONFIG_KPROBES CONFIG_KALLSYMS_ALL CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_KPROBES_HOOK; do
            sed -i "s/^# ${e} is not set/${e}=y/" out/.config
            sed -i "s/^${e}=.*/${e}=y/" out/.config
            grep -q "^${e}=y" out/.config || echo "${e}=y" >> out/.config
          done
          # re-resolve so KSU_KPROBES_HOOK dep chain settles, then verify below
          make O=out ARCH=arm64 olddefconfig

          # Re-resolve dependencies non-interactively and write auto.conf
          make O=out ARCH=arm64 olddefconfig

          echo "==== Key config lines ===="
          egrep -E '^(CONFIG_QTI_GVM|CONFIG_NR_CPUS|CONFIG_HUGETLB_PAGE|CONFIG_TRANSPARENT_HUGEPAGE|CONFIG_BTRFS_FS|CONFIG_TASKSTATS|CONFIG_NFS_FS|CONFIG_KERNEL_GZIP)=' out/.config || true
          echo "==== Vermagic + KSU config verification ===="
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_MODVERSIONS=|CONFIG_MODULE_UNLOAD=|CONFIG_SMP=|CONFIG_PREEMPT=|CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_KPROBES_HOOK=)' out/.config || true
          grep -E 'CONFIG_LOCALVERSION_AUTO' out/.config || true

      # 2b) Hard gate: fail early if vermagic-critical config drifted
      - name: Verify vermagic-critical config
        working-directory: kernel
        run: |
          set -euo pipefail
          grep -q '^CONFIG_LOCALVERSION="-perf-g040f6e737afe"' out/.config || { echo "FATAL: CONFIG_LOCALVERSION wrong"; exit 1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || { echo "FATAL: LOCALVERSION_AUTO still enabled"; exit 1; }
          for e in CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD CONFIG_SMP CONFIG_PREEMPT CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KPROBES CONFIG_KSU_KPROBES_HOOK; do
            grep -q "^${e}=y" out/.config || { echo "FATAL: ${e} not =y"; exit 1; }
          done
          echo "Vermagic + KSU config OK"

      # 3) After finalize, build scripts/headers
      - name: Prepare scripts and headers
        working-directory: ./kernel
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          export HOSTCC=clang-18
          export HOSTCXX=clang++-18
          make ${KERNEL_CMDLINE} scripts CC="ccache clang-18"
          make ${KERNEL_CMDLINE} prepare CC="ccache clang-18"

      - name: Build kernel
        working-directory: kernel
        env:
          KBUILD_OUTPUT: out
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          export LD_LIBRARY_PATH="/usr/lib/llvm-18/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DTC_EXT=dtc
          export HOSTCC=clang-18
          export HOSTCXX=clang++-18

          # Final olddefconfig safety
          make O=out ARCH=arm64 olddefconfig

          # Verify critical toggles
          if ! grep -q '^CONFIG_NR_CPUS=8' out/.config; then
            echo "Error: NR_CPUS not set to 8"
            exit 1
          fi
          for s in CONFIG_BTRFS_FS CONFIG_TASKSTATS CONFIG_TRANSPARENT_HUGEPAGE CONFIG_NFS_FS; do
            if grep -q "^${s}=[my]" out/.config; then
              echo "Error: ${s} still enabled"
              exit 1
            fi
          done

          make ${KERNEL_CMDLINE} CC="ccache clang-18" LD="ld.lld-18" AR="llvm-ar-18" NM="llvm-nm-18" OBJCOPY="llvm-objcopy-18" OBJDUMP="llvm-objdump-18" STRIP="llvm-strip-18" -j"$(nproc)"
          test -f out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image ../AnyKernel3

      - name: Run simple verification on build output
        working-directory: kernel
        run: |
          set -euo pipefail
          if [ -d out ]; then
            echo "Build output exists:"
            ls -lah out | sed -n '1,200p'
            echo "==== kernel.release (vermagic base) ===="
            cat out/include/config/kernel.release || true
          else
            echo "No build output directory found"
            exit 1
          fi

      - name: Build Wi-Fi Module (qca_cld3)
        working-directory: ./kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-18/bin:$PATH
          export LD_LIBRARY_PATH="/usr/lib/llvm-18/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export HOSTCC=clang-18
          export HOSTCXX=clang++-18

          make ${KERNEL_CMDLINE} modules_prepare CC="ccache clang-18"
          make ${KERNEL_CMDLINE} CC="ccache clang-18" LD="ld.lld-18" AR="llvm-ar-18" NM="llvm-nm-18" \
            OBJCOPY="llvm-objcopy-18" OBJDUMP="llvm-objdump-18" STRIP="llvm-strip-18" \
            -j"$(nproc)" M=drivers/staging/qcacld-3.0 modules

          sudo mkdir -p ../modules/vendor/lib/modules
          sudo find out/drivers/staging/qcacld-3.0 -name "*.ko" -exec cp -v {} ../modules/vendor/lib/modules/ \;
          sudo chown -R "$(id -u)":"$(id -g)" ../modules

          echo "==== WiFi module vermagic (MUST match 4.14.356-perf-g040f6e737afe SMP preempt mod_unload modversions aarch64) ===="
          for ko in ../modules/vendor/lib/modules/*.ko; do
            echo "--- ${ko} ---"
            /usr/bin/modinfo "${ko}" 2>/dev/null | grep -i vermagic || \
              strings "${ko}" | grep -m1 'SMP preempt' || true
          done

      - name: Package Kernel
        run: |
          cd AnyKernel3
          zip -r ../${{ env.OUTPUT_ZIP_NAME }}.zip *
          cd ..

      - name: Package Wi-Fi Module
        continue-on-error: true
        run: |
          if [ ! -d "modules/vendor/lib/modules" ] || ! ls modules/vendor/lib/modules/*.ko >/dev/null 2>&1; then
            echo "Error: No Wi-Fi modules found to package!"
            exit 1
          fi
          cd modules
          zip -r ../${{ env.OUTPUT_ZIP_NAME }}-modules.zip *
          cd ..

      - name: Upload kernel build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: kernel/out
          if-no-files-found: warn

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            ${{ env.OUTPUT_ZIP_NAME }}.zip
            ${{ env.OUTPUT_ZIP_NAME }}-modules.zip
          if-no-files-found: warn
