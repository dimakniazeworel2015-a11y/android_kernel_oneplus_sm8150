name: Build kernel (KSN FLAT v1.0.6 + SUSFS + manual hooks + selinux_hide) & WIFI

# =====================================================================
# BOOTABLE rebuild for OnePlus 7T "hotdogb" (SM8150), crDroid 15 / A15.
#
# STRATEGY CHANGE — replicate the device's PROVEN-BOOTING KernelSU setup.
#
# THREE prior builds used KernelSU-Next LEGACY MODULAR + KPROBES and all
# HANG at early boot (black screen after logo, no pstore log). A build with
# selinux_hide DISABLED still hung -> the killer is the modular-KSU+KPROBES
# combination (and/or a dtb/dtbo mismatch), NOT selinux_hide.
#
# The device's currently-BOOTING kernel (from /proc/config.gz, committed as
# device_config) is:
#   * CONFIG_KSU=y + CONFIG_KSU_SUSFS=y + all CONFIG_KSU_SUSFS_*   -> FLAT KSU + SUSFS
#   * "# CONFIG_KPROBES is not set"                                -> MANUAL hooks
#   * CONFIG_LTO_CLANG=y, base 4.14.356
# So the booting recipe = FLAT KernelSU-Next v1.0.6 + SUSFS + MANUAL syscall
# hooks + NO kprobes. This workflow reproduces exactly that, and adds a
# POST-BOOT-deferred selinux_hide (never runs during early init).
#
# KEY IMPLEMENTATION FACTS (verified against the KernelSU-Next v1.0.6 tree):
#   * At v1.0.6 the hook switch is CONFIG_KSU_WITH_KPROBES (default y). There is
#     NO CONFIG_KSU_MANUAL_HOOK and NO "No hooks were defined" build gate here.
#     Setting "# CONFIG_KSU_WITH_KPROBES is not set" (with KPROBES off) selects
#     MANUAL mode: ksu.c only calls ksu_sucompat_init()/ksu_ksud_init() under
#     #ifdef CONFIG_KSU_WITH_KPROBES, so with it off nothing registers kprobes
#     and the ksu_*_hook flags stay =true; the kernel's own call sites drive the
#     handlers. We therefore inject the manual call sites into fs/{exec,open,
#     read_write,stat}.c (the non-GKI integration), which lineage-23.0 lacks.
#   * selinux_hide.c ships ONLY in the legacy modular tree. We commit a ported
#     flat version (selinux_hide.c/.h) that keeps only initialize_fake_status()
#     + hook_selinux_status_open() (the /sys/fs/selinux/status oracle defeat),
#     drops the feature-handler framework, the ksu_input_hook wait, the
#     init-thread and the avc kprobe, and is ENABLED POST-BOOT from the
#     EVENT_BOOT_COMPLETED path in core_hook.c (not during early init).
#   * DTB PRESERVE: AnyKernel3 leaves the device's boot dtb / dtbo alone as long
#     as no separate `dtb` file and no `dtbo.img` are shipped in the zip. We ship
#     only Image.gz-dtb (appended-dtb) and configure anykernel.sh for A/B.
#   * PSTORE: device_config already has PSTORE + PSTORE_CONSOLE + PSTORE_RAM +
#     PSTORE_PMSG =y (verified). We keep them =y so a future hang is captured in
#     /sys/fs/pstore/console-ramoops-*.
#   * Toolchain: apt clang-18/lld-18 at /usr/lib/llvm-18/bin, LLVM=1 LLVM_IAS=0
#     (LLVM_IAS=0 required for 4.14 LSE atomics), GNU as via CROSS_COMPILE.
#   * LTO: kept OFF (bootable-first; device has it on but it is not boot-critical
#     and complicates the clang-18 build). CFI/SCS stay off (device has them off).
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: 'URL of the kernel source repository'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_oneplus_sm8150'
      kernel_branch:
        description: 'Branch of the kernel source (lineage-23.0 == 4.14.356, matches device)'
        required: true
        default: 'lineage-23.0'
      kernel_defconfig:
        description: 'defconfig file to use (device /proc/config.gz committed to repo)'
        required: true
        default: 'hotdogb_defconfig'
      output_name:
        description: 'Name of the output.zip'
        required: false
        default: 'OP7_KSN_flat_susfs_selinuxhide_wifi'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: ${{ github.event.inputs.kernel_defconfig || 'hotdogb_defconfig' }}
      KERNEL_SOURCE_URL: ${{ github.event.inputs.kernel_source_url || 'https://github.com/LineageOS/android_kernel_oneplus_sm8150' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-23.0' }}
      OUTPUT_ZIP_NAME: ${{ github.event.inputs.output_name || 'OP7_KSN_flat_susfs_selinuxhide_wifi' }}
      KSU_TAG: "v1.0.6"
      SUSFS_REPO: "https://github.com/kutemeikito/susfs4ksu"
      SUSFS_BRANCH: "kernel-4.14"

    steps:
      - name: Checkout repository (holds device_config + selinux_hide port)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Kernel Source (lineage-23.0 == 4.14.356)
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_SOURCE_URL}" kernel
          cd kernel
          git submodule update --init --recursive || true
          echo "==== base kernel version (MUST be 4.14.356) ===="
          make kernelversion || head -5 Makefile

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Cleanup space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /usr/share/dotnet "$AGENT_TOOLSDIRECTORY" || true

      - name: Install dependencies + apt clang-18 (proven to build this 4.14 tree)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils \
            make python3 libssl-dev libelf-dev build-essential bc bison flex unzip \
            ca-certificates xz-utils cpio device-tree-compiler git git-lfs patch curl
          test -x /usr/lib/llvm-18/bin/clang || { echo "FATAL: clang-18 missing"; exit 1; }
          test -x /usr/lib/llvm-18/bin/ld.lld || { echo "FATAL: ld.lld-18 missing"; exit 1; }
          /usr/lib/llvm-18/bin/clang --version || true
          # 4.14 LSE-atomics inline asm is rejected by clang IAS -> use GNU as.
          command -v aarch64-linux-gnu-as >/dev/null || { echo "FATAL: aarch64-linux-gnu-as missing"; exit 1; }
          aarch64-linux-gnu-as --version | head -1
          command -v arm-linux-gnueabi-as >/dev/null || { echo "FATAL: arm-linux-gnueabi-as missing"; exit 1; }
          arm-linux-gnueabi-as --version | head -1
          # AnyKernel3 packaging template (osm0sis upstream)
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git

      - name: Get Version
        id: get_version
        run: |
          cd kernel
          COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          echo "VERSION=$(expr ${COUNT:-0} + 10200)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # KernelSU-Next FLAT v1.0.6 (kernel/*.c layout: ksu.c, sucompat.c,
      # ksud.c, core_hook.c, selinux/). setup.sh symlinks drivers/kernelsu ->
      # KernelSU-Next/kernel and edits drivers/{Makefile,Kconfig}. This is the
      # exact flat tree the device ships.
      # ------------------------------------------------------------------
      - name: KernelSU-Next setup (FLAT v1.0.6)
        working-directory: ./kernel
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_TAG}/kernel/setup.sh" | bash -s "${KSU_TAG}"
          echo "==== KernelSU-Next checkout ===="
          [ -d KernelSU-Next ] && git -C KernelSU-Next log -1 --oneline || true
          echo "==== confirm FLAT layout (kernel/ksu.c, sucompat.c, ksud.c present) ===="
          for f in KernelSU-Next/kernel/ksu.c KernelSU-Next/kernel/sucompat.c \
                   KernelSU-Next/kernel/ksud.c KernelSU-Next/kernel/core_hook.c \
                   KernelSU-Next/kernel/selinux/selinux.c; do
            test -f "$f" || { echo "FATAL: $f missing (not the flat v1.0.6 tree)"; exit 1; }
          done
          # Flat v1.0.6 must NOT have the modular feature/ dir.
          if [ -d KernelSU-Next/kernel/feature ]; then
            echo "FATAL: kernel/feature/ present -> this is the modular tree, expected FLAT v1.0.6"; exit 1
          fi
          echo "FLAT KSU-Next v1.0.6 tree OK"
          echo "==== drivers/kernelsu symlink ===="
          ls -l drivers/kernelsu || true

      # ------------------------------------------------------------------
      # SUSFS (keep it — preserves the device's hiding + Play Integrity STRONG).
      # susfs4ksu kernel-4.14: apply the kernel-side 50_ patch at kernel root,
      # then the KSU-side 10_ bridge inside KernelSU-Next/. Both apply to the
      # flat v1.0.6 tree (18 target files all present; Kconfig symbols match
      # device_config exactly: HAS_MAGIC_MOUNT/SUS_PATH/SUS_MOUNT/SPOOF_UNAME/
      # OPEN_REDIRECT/...).
      # ------------------------------------------------------------------
      - name: Apply SUSFS (kernel 50_ patch + KSU 10_ bridge)
        working-directory: ./kernel
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${SUSFS_BRANCH}" "${SUSFS_REPO}" ../susfs4ksu
          KP="../susfs4ksu/kernel_patches"
          test -f "${KP}/50_add_susfs_in_kernel-4.14.patch" || { echo "FATAL: 50_ susfs patch missing"; exit 1; }
          test -f "${KP}/KernelSU/10_enable_susfs_for_ksu.patch" || { echo "FATAL: 10_ susfs bridge missing"; exit 1; }

          echo "==== copy susfs kernel-side sources (fs/ include/) ===="
          cp -v "${KP}/fs/"* fs/ 2>/dev/null || true
          cp -v "${KP}/include/linux/"* include/linux/ 2>/dev/null || true

          echo "==== apply kernel-side 50_ susfs patch at kernel root ===="
          # task_mmu.c hunk #1 (the <linux/susfs_def.h> include) fails on lineage
          # because an added <linux/ctype.h> after <linux/mm_inline.h> perturbs it;
          # let patch continue (|| true), then repair the missing include below.
          patch -p1 --no-backup-if-mismatch < "${KP}/50_add_susfs_in_kernel-4.14.patch" || true
          if ! grep -q '#include <linux/susfs_def.h>' fs/proc/task_mmu.c; then
            sed -i '/#include <linux\/mm_inline.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux\/susfs_def.h>\n#endif' fs/proc/task_mmu.c
          fi
          grep -q '#include <linux/susfs_def.h>' fs/proc/task_mmu.c \
            || { echo "FATAL: task_mmu susfs_def include not injected"; exit 1; }
          echo "task_mmu.c susfs_def include OK"

          echo "==== apply KSU-side 10_ bridge inside KernelSU-Next/ ===="
          cp "${KP}/KernelSU/10_enable_susfs_for_ksu.patch" KernelSU-Next/
          ( cd KernelSU-Next && patch -p1 --no-backup-if-mismatch < 10_enable_susfs_for_ksu.patch )

          echo "==== susfs sanity: susfs Kconfig symbols now present in KSU Kconfig ===="
          grep -q 'KSU_SUSFS' KernelSU-Next/kernel/Kconfig || { echo "FATAL: susfs Kconfig bridge not applied"; exit 1; }
          echo "susfs applied OK"

      # ------------------------------------------------------------------
      # MANUAL SYSCALL HOOKS (non-GKI integration) — lineage-23.0 lacks them.
      # Inject ksu_handle_* call sites into fs/{exec,open,read_write,stat}.c.
      # Each insertion is anchored to a stable line and hard-asserted, so a
      # tree drift fails the build loudly instead of silently shipping a
      # rootless kernel. The generic ksu_handle_execveat (ksu.c) drives both
      # the sucompat and ksud execve handlers.
      # ------------------------------------------------------------------
      - name: Integrate manual syscall hooks (fs/exec,open,read_write,stat)
        working-directory: ./kernel
        run: |
          set -euo pipefail
          # Call the committed injector (anchored + hard-asserted + idempotent).
          python3 "${GITHUB_WORKSPACE}/scripts_ksn/apply_manual_hooks.py" "$(pwd)"
          echo "==== manual hook call sites ===="
          grep -n 'ksu_handle_execveat' fs/exec.c | head -3
          grep -n 'ksu_handle_faccessat' fs/open.c | head -3
          grep -n 'ksu_handle_sys_read' fs/read_write.c | head -3
          grep -n 'ksu_handle_stat' fs/stat.c | head -3

      # ------------------------------------------------------------------
      # Port selinux_hide into the FLAT tree + wire a POST-BOOT deferred enable.
      # selinux_hide.c/.h are committed in this repo (flat-adapted: only the
      # fake status page + fops patch, feature-handler/init-thread/kprobe
      # removed). Copy them into KernelSU-Next/kernel/, add to the Makefile,
      # and call ksu_selinux_hide_enable_deferred() from EVENT_BOOT_COMPLETED
      # in core_hook.c (post-boot, NOT early init).
      # ------------------------------------------------------------------
      - name: Port selinux_hide into flat tree (deferred, post-boot)
        working-directory: ./kernel
        run: |
          set -euo pipefail
          # Copies selinux_hide.c/.h into the flat tree, adds selinux_hide.o to
          # the Makefile, and wires ksu_selinux_hide_enable_deferred() into the
          # EVENT_BOOT_COMPLETED branch of core_hook.c (post-boot). All anchored
          # + hard-asserted + idempotent.
          python3 "${GITHUB_WORKSPACE}/scripts_ksn/port_selinux_hide.py" "$(pwd)" "${GITHUB_WORKSPACE}"
          echo "==== Makefile obj list ===="
          grep -n 'kernelsu-objs' KernelSU-Next/kernel/Makefile | head -20
          echo "==== boot_complete wiring (deferred call must follow the pr_info) ===="
          grep -n -A1 'boot_complete triggered' KernelSU-Next/kernel/core_hook.c | head

      # KSN sulog time API fix — not needed for flat v1.0.6 (no sulog/ dir).
      # Kept as a tolerant no-op guard in case a future tree adds it.
      - name: (Optional) sulog time API fix if present
        working-directory: ./kernel
        run: |
          set -uo pipefail
          F=KernelSU-Next/kernel/sulog/event.c
          if [ -f "$F" ] && grep -q 'get_monotonic_boottime(&ts)' "$F"; then
            sed -i 's/get_monotonic_boottime(&ts)/ktime_get_boottime_ts64(\&ts)/g' "$F"
            echo "[sulog] patched"
          else
            echo "[sulog] not present in flat v1.0.6 (ok)"
          fi

      # hugetlbpage fix (idempotent) — device ships hugetlb pieces, keep building.
      - name: Apply hugetlbpage fix patch (idempotent, tolerant)
        working-directory: kernel
        run: |
          set -uo pipefail
          F=arch/arm64/mm/hugetlbpage.c
          if [ -f "$F" ]; then
            if grep -q 'pte_t \*pte = NULL;' "$F" && ! grep -q 'pte_t \*ptep = NULL;' "$F"; then
              sed -i '/pte_t \*pte = NULL;/a \  pte_t *ptep = NULL;' "$F" || true
            fi
            sed -i 's/ptep = huge_pmd_share(mm, vma, addr, pud);/if (!ptep) ptep = huge_pmd_share(mm, vma, addr, pud);/' "$F" || true
          fi
          echo "[hugetlbpage] ok"

      # ------------------------------------------------------------------
      # Install the device's real config as the build base defconfig and
      # transform it to MATCH the device's booting KSU setup:
      #   * KEEP CONFIG_KSU=y and ALL CONFIG_KSU_SUSFS* (device has them)
      #   * KEEP "# CONFIG_KPROBES is not set"  (MANUAL hooks like the device)
      #   * add "# CONFIG_KSU_WITH_KPROBES is not set" (v1.0.6 manual-mode switch)
      #   * KEEP PSTORE/PSTORE_CONSOLE/PSTORE_RAM/PSTORE_PMSG =y (hang capture)
      #   * LTO OFF (bootable-first; not boot-critical), CFI/SCS off
      #   * LOCALVERSION="-perf", AUTO off  -> base == 4.14.356-perf
      #   * KEEP MODVERSIONS + MODULE_UNLOAD (wlan.ko vermagic)
      #   * DT overlay OFF (broken .dtbo compile; appended dtb unaffected)
      # Everything else in the device config is preserved untouched.
      # ------------------------------------------------------------------
      - name: Install device config as base defconfig (match device KSU setup)
        working-directory: kernel
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}/device_config"
          DST="arch/arm64/configs/${KERNEL_DEFCONFIG}"
          test -f "$SRC" || { echo "FATAL: device_config not found at $SRC"; exit 1; }
          cp "$SRC" "$DST"

          echo "==== apply KSN-flat/manual/vermagic/LTO deltas (keep susfs + kprobes-off) ===="
          drop() { sed -i "/^${1}=/d;/^# ${1} is not set$/d" "$DST"; }
          for s in CONFIG_KPROBES CONFIG_KRETPROBES \
                   CONFIG_KSU_WITH_KPROBES CONFIG_KSU_KPROBES_HOOK CONFIG_KSU_MANUAL_HOOK \
                   CONFIG_LOCALVERSION CONFIG_LOCALVERSION_AUTO \
                   CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD \
                   CONFIG_LTO CONFIG_LTO_CLANG CONFIG_THINLTO CONFIG_CFI_CLANG \
                   CONFIG_BUILD_ARM64_DT_OVERLAY; do
            drop "$s"
          done
          # NOTE: pipe through sed to strip the YAML indentation so every
          # appended line starts at column 0 (kconfig ignores indented lines).
          sed 's/^[[:space:]]*//' >> "$DST" <<'EOF'
          # --- KernelSU-Next FLAT v1.0.6: MANUAL hooks, NO kprobes (like device) ---
          # CONFIG_KPROBES is not set
          # CONFIG_KSU_WITH_KPROBES is not set
          CONFIG_KSU=y
          # --- vermagic base: 4.14.356-perf (device: -perf, AUTO adds git sha off) ---
          CONFIG_LOCALVERSION="-perf"
          # CONFIG_LOCALVERSION_AUTO is not set
          # --- module loading (wlan.ko vermagic parts) ---
          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_UNLOAD=y
          # --- LTO OFF (bootable-first; not boot-critical, CFI/SCS off on device) ---
          # CONFIG_LTO is not set
          # CONFIG_LTO_CLANG is not set
          # CONFIG_THINLTO is not set
          # CONFIG_CFI_CLANG is not set
          # --- DT overlay OFF: broken .dtbo compile; appended boot dtb unaffected ---
          # CONFIG_BUILD_ARM64_DT_OVERLAY is not set
          # --- pstore/ramoops console capture (hang forensics) ---
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_PMSG=y
          CONFIG_PSTORE_RAM=y
          EOF
          echo "==== assert susfs symbols are PRESERVED (device ships them) ===="
          grep -q '^CONFIG_KSU_SUSFS=y' "$DST" || { echo "FATAL: CONFIG_KSU_SUSFS dropped (must keep)"; exit 1; }
          echo "==== tail of transformed defconfig ===="
          tail -n 40 "$DST"

      - name: Seed .config from device defconfig
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${KERNEL_DEFCONFIG}"

      - name: Finalize + enforce KSN-flat/manual/vermagic (non-interactive)
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          C=out/.config
          set_y()  { sed -i "s/^# ${1} is not set/${1}=y/; s/^${1}=.*/${1}=y/" "$C"; grep -q "^${1}=y" "$C" || echo "${1}=y" >> "$C"; }
          set_n()  { sed -i "s/^${1}=.*/# ${1} is not set/" "$C"; grep -q "^# ${1} is not set" "$C" || echo "# ${1} is not set" >> "$C"; }
          set_str(){ sed -i "s/^${1}=.*/${1}=\"${2}\"/" "$C"; grep -q "^${1}=" "$C" || echo "${1}=\"${2}\"" >> "$C"; }

          # KSU on + MANUAL hooks: KPROBES + WITH_KPROBES must be OFF.
          set_y CONFIG_KSU
          set_n CONFIG_KPROBES
          set_n CONFIG_KRETPROBES
          set_n CONFIG_KSU_WITH_KPROBES
          set_n CONFIG_KSU_KPROBES_HOOK
          set_n CONFIG_KSU_MANUAL_HOOK
          # module + vermagic
          for e in CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD \
                   CONFIG_SMP CONFIG_PREEMPT \
                   CONFIG_PSTORE CONFIG_PSTORE_CONSOLE CONFIG_PSTORE_PMSG CONFIG_PSTORE_RAM; do set_y "$e"; done
          set_n CONFIG_LOCALVERSION_AUTO
          set_n CONFIG_LTO
          set_n CONFIG_LTO_CLANG
          set_n CONFIG_THINLTO
          set_n CONFIG_CFI_CLANG
          set_n CONFIG_BUILD_ARM64_DT_OVERLAY
          set_str CONFIG_LOCALVERSION "-perf"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          echo "==== key config after finalize ===="
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_MODVERSIONS=|CONFIG_MODULE_UNLOAD=|CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_PSTORE=|CONFIG_PSTORE_RAM=)' "$C" || true
          echo "==== these MUST be off (manual hooks) ===="
          grep -E 'CONFIG_KPROBES|CONFIG_KSU_WITH_KPROBES|CONFIG_LTO_CLANG|CONFIG_LOCALVERSION_AUTO' "$C" || true

      - name: Hard gate — fail early if boot/vermagic/KSU config drifted
        working-directory: kernel
        run: |
          set -euo pipefail
          C=out/.config
          grep -q '^CONFIG_LOCALVERSION="-perf"' "$C" || { echo "FATAL: LOCALVERSION wrong"; exit 1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' "$C" || { echo "FATAL: LOCALVERSION_AUTO on"; exit 1; }
          # MANUAL hooks: KPROBES + WITH_KPROBES must be OFF (this is the device's setup)
          grep -q '^# CONFIG_KPROBES is not set' "$C" || { echo "FATAL: KPROBES on (must be off for manual hooks)"; exit 1; }
          if grep -q '^CONFIG_KSU_WITH_KPROBES=y' "$C"; then echo "FATAL: KSU_WITH_KPROBES on (must be off)"; exit 1; fi
          # KSU + susfs must be present (device ships them)
          grep -q '^CONFIG_KSU=y' "$C" || { echo "FATAL: CONFIG_KSU not =y"; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS=y' "$C" || { echo "FATAL: CONFIG_KSU_SUSFS not =y (device ships susfs)"; exit 1; }
          # device options that must survive
          for e in CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD CONFIG_TASKSTATS CONFIG_KALLSYMS_ALL \
                   CONFIG_PSTORE CONFIG_PSTORE_CONSOLE CONFIG_PSTORE_RAM; do
            grep -q "^${e}=y" "$C" || { echo "FATAL: ${e} not =y"; exit 1; }
          done
          # LTO off (bootable-first)
          if grep -q '^CONFIG_LTO_CLANG=y' "$C"; then echo "FATAL: LTO_CLANG on (must be off)"; exit 1; fi
          # DT overlay off (broken .dtbo compile)
          if grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' "$C"; then echo "FATAL: DT_OVERLAY on"; exit 1; fi
          echo "Boot/vermagic/KSU config gate OK (FLAT KSU + susfs + manual hooks + pstore, LTO off, overlay off)"

      - name: Prepare scripts and headers
        working-directory: ./kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            scripts prepare

      - name: Build kernel (apt clang-18, ld.lld-18, LTO off)
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export KBUILD_BUILD_USER=ci
          export KBUILD_BUILD_HOST=github

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          for s in CONFIG_TASKSTATS CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_PSTORE_RAM; do
            grep -q "^${s}=y" out/.config || echo "WARN: ${s} not =y"
          done
          grep -q '^# CONFIG_LTO_CLANG is not set' out/.config && echo "LTO off (as intended)" || echo "WARN: LTO not explicitly off"

          make -j"$(nproc)" ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          ls -lah out/arch/arm64/boot/ || true
          # Ship ONLY the appended-dtb image so AnyKernel3 preserves the device dtb/dtbo.
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../AnyKernel3/
          fi
          test -f ../AnyKernel3/Image.gz-dtb || test -f ../AnyKernel3/Image \
            || { echo "FATAL: no kernel image produced"; exit 1; }

      - name: Show vermagic base
        working-directory: kernel
        run: |
          echo "==== kernel.release (vermagic base, expect 4.14.356-perf) ===="
          cat out/include/config/kernel.release || true

      - name: Build Wi-Fi Module (qca_cld3, in-tree, matching vermagic)
        working-directory: ./kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            modules_prepare
          make -j"$(nproc)" ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M=drivers/staging/qcacld-3.0 modules || \
          make -j"$(nproc)" ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M=drivers/staging/qca-wifi-host-cmn modules || true

          mkdir -p ../modules/vendor/lib/modules
          find out -name "*.ko" -path "*qca*" -exec cp -v {} ../modules/vendor/lib/modules/ \; || true
          echo "==== wlan.ko vermagic (must match kernel: 4.14.356-perf ... modversions) ===="
          for ko in ../modules/vendor/lib/modules/*.ko; do
            [ -f "$ko" ] || continue
            echo "--- $ko ---"
            /sbin/modinfo "$ko" 2>/dev/null | grep -i vermagic || strings "$ko" | grep -m1 'SMP preempt' || true
          done

      # ------------------------------------------------------------------
      # Configure AnyKernel3 to flash ONLY the kernel and PRESERVE the device's
      # dtb + dtbo. Mechanism: AnyKernel3 falls back to the unpacked originals
      # for any component NOT shipped in the zip. We ship only Image.gz-dtb
      # (dtb appended), and ship NO separate `dtb` file and NO `dtbo.img`, so the
      # boot ramdisk keeps its original dtb and the dtbo partition is untouched.
      # A/B (hotdogb): IS_SLOT_DEVICE=1, BLOCK=boot by-name, keep vbmeta auto.
      # ------------------------------------------------------------------
      - name: Configure AnyKernel3 (kernel-only, preserve dtb/dtbo, A/B)
        run: |
          set -euo pipefail
          AK=AnyKernel3/anykernel.sh
          test -f "$AK" || { echo "FATAL: anykernel.sh missing"; exit 1; }
          # ensure no stray dtb/dtbo artifacts get packed (presence in the zip
          # is what makes AnyKernel3 overwrite them; absence = preserve).
          rm -f AnyKernel3/dtb AnyKernel3/dtb.img AnyKernel3/dtbo AnyKernel3/dtbo.img AnyKernel3/recovery_dtbo 2>/dev/null || true

          python3 "${GITHUB_WORKSPACE}/scripts_ksn/config_anykernel.py" "$AK"
          echo "==== anykernel.sh key lines ===="
          grep -nE '^(kernel\.string|do\.devicecheck|do\.modules|BLOCK|IS_SLOT_DEVICE|RAMDISK_COMPRESSION|PATCH_VBMETA_FLAG)=' "$AK" | head -20
          echo "==== AnyKernel3 zip contents (must contain Image.gz-dtb, NO dtb/dtbo) ===="
          ls -la AnyKernel3/ | grep -iE 'image|dtb' || true
          if ls AnyKernel3/ | grep -qiE '^(dtb|dtbo|dtbo\.img|dtb\.img)$'; then
            echo "FATAL: a dtb/dtbo file is in the zip; would overwrite device dtb"; exit 1
          fi
          echo "dtb/dtbo preserve OK (only Image.gz-dtb shipped)"

      - name: Package Kernel (AnyKernel3)
        run: |
          set -euo pipefail
          cd AnyKernel3
          zip -r "../${OUTPUT_ZIP_NAME}.zip" *
          cd ..

      - name: Package Wi-Fi Module
        continue-on-error: true
        run: |
          if ls modules/vendor/lib/modules/*.ko >/dev/null 2>&1; then
            cd modules
            zip -r "../${OUTPUT_ZIP_NAME}-modules.zip" *
            cd ..
          else
            echo "No Wi-Fi modules produced (kernel still shippable; stock wlan.ko may load if vermagic matches)."
          fi

      - name: Upload kernel build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            kernel/out/.config
            kernel/out/include/config/kernel.release
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
          if-no-files-found: warn

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            ${{ env.OUTPUT_ZIP_NAME }}.zip
            ${{ env.OUTPUT_ZIP_NAME }}-modules.zip
          if-no-files-found: warn
