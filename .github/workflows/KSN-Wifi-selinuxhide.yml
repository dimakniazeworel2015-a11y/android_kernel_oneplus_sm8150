name: Build kernel (KSN legacy modular + selinux_hide, NO susfs) & WIFI

# =====================================================================
# BOOTABLE rebuild for OnePlus 7T "hotdogb" (SM8150), crDroid 15 / A15.
#
# WHY THE PREVIOUS BUILD (#6) BLACK-SCREENED (early panic, no pstore):
#   * built from LineageOS lineage-22.1 == 4.14.35*5*  (device is .356)
#     -> appended dtb / kernel base did not match the device -> panic.
#   * used lineage_sm8150_defconfig (a generic config) instead of the
#     device's OWN /proc/config.gz -> missing device-critical options.
#   * a ci.defaults block DISABLED options the device ships =y
#     (CONFIG_TASKSTATS, HUGETLB*, TRANSPARENT_HUGEPAGE, NFS, BTRFS, KSM...)
#     -> userspace/driver mismatch -> panic.
#   * built WITHOUT LTO while the device is CONFIG_LTO_CLANG=y.
#
# WHAT CHANGED HERE (the fixes):
#   1. SOURCE BRANCH = lineage-23.0  (Makefile SUBLEVEL = 356 == device).
#      lineage-22.1 is SUBLEVEL 355. Verified via the LineageOS Makefile.
#   2. BASE DEFCONFIG = the device's real /proc/config.gz, committed to the
#      repo as arch/arm64/configs/hotdogb_defconfig, used verbatim. We do
#      NOT disable device options.
#   3. Strip the OLD FLAT CONFIG_KSU_SUSFS* symbols from that config (they
#      do not exist in modular KSU-Next legacy; susfs is dropped on 4.14).
#      Keep CONFIG_KSU=y; add KPROBES+KRETPROBES+KSU_KPROBES_HOOK+
#      KALLSYMS_ALL; force KSU_MANUAL_HOOK off.
#   4. LTO OFF (bootable-first). LTO is only an optimization here — CFI/SCS
#      are off on this device, so LTO is not boot-critical. LTO+clang was the
#      failure source, so it is disabled to get a BOOTABLE kernel first.
#      Toolchain = distro clang-18/lld-18/llvm-18 from apt (/usr/lib/llvm-18/
#      bin), which built #3-#6 of this 4.14 tree cleanly. The ZyCromerZ
#      clang-16 rejected the 4.14 LSE-atomics inline asm and was reverted.
#   5. Preserve every other device option (mm/fs/drivers) untouched.
#   6. Rebuild qca_cld3-3.0 wlan.ko in-tree so its vermagic matches the
#      freshly built kernel; keep MODVERSIONS + MODULE_UNLOAD.
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: 'URL of the kernel source repository'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_oneplus_sm8150'
      kernel_branch:
        description: 'Branch of the kernel source (lineage-23.0 == 4.14.356, matches device)'
        required: true
        default: 'lineage-23.0'
      kernel_defconfig:
        description: 'defconfig file to use (device /proc/config.gz committed to repo)'
        required: true
        default: 'hotdogb_defconfig'
      output_name:
        description: 'Name of the output.zip'
        required: false
        default: 'OP7_KSN_selinuxhide_wifi'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: ${{ github.event.inputs.kernel_defconfig || 'hotdogb_defconfig' }}
      KERNEL_SOURCE_URL: ${{ github.event.inputs.kernel_source_url || 'https://github.com/LineageOS/android_kernel_oneplus_sm8150' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-23.0' }}
      OUTPUT_ZIP_NAME: ${{ github.event.inputs.output_name || 'OP7_KSN_selinuxhide_wifi' }}

    steps:
      - name: Checkout repository (holds hotdogb_defconfig)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Kernel Source (lineage-23.0 == 4.14.356)
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${KERNEL_BRANCH}" "${KERNEL_SOURCE_URL}" kernel
          cd kernel
          git submodule update --init --recursive || true
          echo "==== base kernel version (MUST be 4.14.356) ===="
          make kernelversion || head -5 Makefile

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Cleanup space
        run: |
          sudo rm -rf /opt/ghc /usr/local/share/boost /usr/share/dotnet "$AGENT_TOOLSDIRECTORY" || true

      - name: Install dependencies + apt clang-18 (proven to build this 4.14 tree)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # Distro clang-18/lld-18/llvm-18 from apt. Builds #3-#6 of THIS kernel
          # compiled cleanly with clang-18/lld-18 at /usr/lib/llvm-18/bin.
          # The ZyCromerZ clang-16 rejected the 4.14 LSE-atomics inline asm
          # ("unknown register name 'w0' in asm"), so it was reverted.
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils \
            make python3 libssl-dev libelf-dev build-essential bc bison flex unzip \
            ca-certificates xz-utils cpio device-tree-compiler git git-lfs patch curl
          test -x /usr/lib/llvm-18/bin/clang || { echo "FATAL: clang-18 missing after apt install"; exit 1; }
          test -x /usr/lib/llvm-18/bin/ld.lld || { echo "FATAL: ld.lld-18 missing after apt install"; exit 1; }
          /usr/lib/llvm-18/bin/clang --version || true
          # GNU assembler is REQUIRED: 4.14 LSE-atomics inline asm
          # (atomic_lse.h "unknown register name 'w0'") is rejected by clang's
          # integrated assembler. We build with LLVM=1 LLVM_IAS=0 so clang uses
          # -fno-integrated-as and calls aarch64-linux-gnu-as (from
          # binutils-aarch64-linux-gnu). Verify it is reachable.
          command -v aarch64-linux-gnu-as >/dev/null || { echo "FATAL: aarch64-linux-gnu-as missing (binutils-aarch64-linux-gnu)"; exit 1; }
          aarch64-linux-gnu-as --version | head -1
          command -v arm-linux-gnueabi-as >/dev/null || { echo "FATAL: arm-linux-gnueabi-as missing (gcc-arm-linux-gnueabi)"; exit 1; }
          arm-linux-gnueabi-as --version | head -1
          # AnyKernel3 packaging template
          git clone --depth=1 https://github.com/khalidaboelmagd/AnyKernel3
          rm -rf AnyKernel3/.git

      - name: Get Version
        id: get_version
        run: |
          cd kernel
          COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          echo "VERSION=$(expr ${COUNT:-0} + 10200)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # KernelSU-Next `legacy` branch (MODULAR kernel/ layout: kernel/core/,
      # kernel/feature/, kernel/hook/). NO susfs.
      #
      # legacy carries kernel/feature/selinux_hide.c (fake SELinux status
      # page + patched /sys/fs/selinux/status fops + avc kprobe). It is
      # independent of susfs, so it compiles/links without the susfs bridge
      # symbols. setup.sh checks out legacy, symlinks drivers/kernelsu ->
      # KernelSU-Next/kernel, and edits drivers/Makefile + drivers/Kconfig.
      # ------------------------------------------------------------------
      - name: KernelSU-Next setup (legacy modular)
        working-directory: ./kernel
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          echo "==== KernelSU-Next checkout ===="
          [ -d KernelSU-Next ] && git -C KernelSU-Next log -1 --oneline || true
          echo "==== confirm MODULAR layout + selinux_hide.c present ===="
          test -f KernelSU-Next/kernel/feature/selinux_hide.c \
            || { echo "FATAL: kernel/feature/selinux_hide.c missing (not legacy modular tree)"; exit 1; }
          echo "modular KSU-Next tree OK: selinux_hide.c present"
          # selinux_hide.c: `extern bool ksu_input_hook __read_mostly` (weak)
          # + a `while (READ_ONCE(ksu_input_hook)) msleep()` wait. With the
          # kprobes hook (MANUAL_HOOK off) nothing DEFINES the symbol, so the
          # weak extern resolves to NULL and the wait spins forever /
          # selinux_hide never inits. Define it =false in a compiled KSU
          # source so it links to a real symbol AND the wait is skipped.
          F=KernelSU-Next/kernel/core/init.c
          if ! grep -q 'bool ksu_input_hook' "$F"; then
            printf '\n#include <linux/types.h>\n#include <linux/cache.h>\nbool ksu_input_hook __read_mostly = false;\n' >> "$F"
          fi
          echo "ksu_input_hook def:"; grep -n 'ksu_input_hook' "$F" \
            || { echo "FATAL: ksu_input_hook not defined"; exit 1; }

      # Patch 1: arch/arm64/mm/hugetlbpage.c (idempotent, only if the file
      # has the old shape). Device ships hugetlb pieces so keep it building.
      - name: Apply hugetlbpage fix patch (idempotent, tolerant)
        working-directory: kernel
        run: |
          set -uo pipefail
          F=arch/arm64/mm/hugetlbpage.c
          if [ -f "$F" ]; then
            if grep -q 'pte_t \*pte = NULL;' "$F" && ! grep -q 'pte_t \*ptep = NULL;' "$F"; then
              sed -i '/pte_t \*pte = NULL;/a \  pte_t *ptep = NULL;' "$F" || true
            fi
            sed -i 's/ptep = huge_pmd_share(mm, vma, addr, pud);/if (!ptep) ptep = huge_pmd_share(mm, vma, addr, pud);/' "$F" || true
          fi
          echo "[hugetlbpage] ok"

      # ------------------------------------------------------------------
      # Install the device's real config as the build base defconfig and
      # transform it for modular KSU-Next legacy + kprobes + selinux_hide.
      #   * drop every flat CONFIG_KSU_SUSFS* line (symbol does not exist)
      #   * flip KPROBES on + KRETPROBES + KSU_KPROBES_HOOK + KALLSYMS_ALL
      #   * force KSU_MANUAL_HOOK off (fresh tree has no manual hooks; and
      #     the Kconfig defaults MANUAL_HOOK=y when KPROBES is off, so we
      #     must both enable KPROBES and pin MANUAL_HOOK off)
      #   * force LTO off (bootable-first; not boot-critical, CFI/SCS stay off)
      #   * LOCALVERSION="-perf", AUTO off  -> base == 4.14.356-perf
      #   * keep MODVERSIONS + MODULE_UNLOAD (wlan.ko vermagic)
      # Everything else in the device config is preserved untouched.
      # ------------------------------------------------------------------
      - name: Install device config as base defconfig (transform for KSN legacy)
        working-directory: kernel
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}/device_config"
          DST="arch/arm64/configs/${KERNEL_DEFCONFIG}"
          test -f "$SRC" || { echo "FATAL: device_config not found at $SRC"; exit 1; }
          cp "$SRC" "$DST"

          echo "==== strip flat susfs symbols (modular legacy has none) ===="
          sed -i '/^CONFIG_KSU_SUSFS/d;/^# CONFIG_KSU_SUSFS.* is not set$/d' "$DST"
          # drop the now-empty "KernelSU - SUSFS" comment header line too
          sed -i '/# KernelSU - SUSFS/d' "$DST"

          echo "==== apply KSN-legacy + kprobes + vermagic deltas ===="
          # helper: set a symbol to a value in the defconfig fragment style
          drop() { sed -i "/^${1}=/d;/^# ${1} is not set$/d" "$DST"; }
          for s in CONFIG_KPROBES CONFIG_KRETPROBES CONFIG_KALLSYMS_ALL \
                   CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_KSU_KPROBES_HOOK \
                   CONFIG_LOCALVERSION CONFIG_LOCALVERSION_AUTO \
                   CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD \
                   CONFIG_LTO CONFIG_LTO_CLANG CONFIG_THINLTO; do
            drop "$s"
          done
          cat >> "$DST" <<'EOF'
          # --- KernelSU-Next (legacy modular) + kprobes hooks, NO susfs ---
          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KSU=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_KPROBES_HOOK=y
          # --- vermagic base: 4.14.356-perf (device: -perf, AUTO adds git sha) ---
          CONFIG_LOCALVERSION="-perf"
          # CONFIG_LOCALVERSION_AUTO is not set
          # --- module loading (wlan.ko vermagic parts) ---
          CONFIG_MODULES=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_UNLOAD=y
          # --- LTO OFF: not boot-critical (CFI/SCS already off on this device),
          #     and LTO+clang was the failure source. Get a BOOTABLE kernel first. ---
          # CONFIG_LTO is not set
          # CONFIG_LTO_CLANG is not set
          # CONFIG_THINLTO is not set
          EOF
          echo "==== tail of transformed defconfig ===="
          tail -n 30 "$DST"
          echo "==== assert no susfs symbol remains ===="
          if grep -q 'CONFIG_KSU_SUSFS' "$DST"; then echo "FATAL: susfs symbol survived"; exit 1; fi

      - name: Seed .config from device defconfig
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${KERNEL_DEFCONFIG}"

      - name: Finalize + enforce KSN/vermagic/LTO (non-interactive)
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          C=out/.config

          # Force the KSN + vermagic symbols (defconfig can be re-derived
          # by olddefconfig; pin them directly in .config, then re-resolve).
          set_y()  { sed -i "s/^# ${1} is not set/${1}=y/; s/^${1}=.*/${1}=y/" "$C"; grep -q "^${1}=y" "$C" || echo "${1}=y" >> "$C"; }
          set_n()  { sed -i "s/^${1}=.*/# ${1} is not set/" "$C"; grep -q "^# ${1} is not set" "$C" || echo "# ${1} is not set" >> "$C"; }
          set_str(){ sed -i "s/^${1}=.*/${1}=\"${2}\"/" "$C"; grep -q "^${1}=" "$C" || echo "${1}=\"${2}\"" >> "$C"; }

          for e in CONFIG_KPROBES CONFIG_KRETPROBES CONFIG_KALLSYMS_ALL \
                   CONFIG_KSU CONFIG_KSU_KPROBES_HOOK \
                   CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD \
                   CONFIG_SMP CONFIG_PREEMPT; do set_y "$e"; done
          set_n CONFIG_KSU_MANUAL_HOOK
          set_n CONFIG_LOCALVERSION_AUTO
          # LTO OFF: not boot-critical (CFI/SCS off on this device) and LTO+clang
          # was the failure source. Pin LTO off so olddefconfig can't turn it on.
          set_n CONFIG_LTO
          set_n CONFIG_LTO_CLANG
          set_n CONFIG_THINLTO
          # CFI depends on LTO; device has CFI off. Keep it off (do NOT enable).
          set_n CONFIG_CFI_CLANG
          set_str CONFIG_LOCALVERSION "-perf"

          # Re-resolve twice so the KSU dep chains settle deterministically.
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          echo "==== key config after finalize ===="
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_MODVERSIONS=|CONFIG_MODULE_UNLOAD=|CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KRETPROBES=|CONFIG_KSU_KPROBES_HOOK=|CONFIG_TASKSTATS=)' "$C" || true
          grep -E 'CONFIG_LOCALVERSION_AUTO|CONFIG_KSU_MANUAL_HOOK|CONFIG_CFI_CLANG|CONFIG_LTO' "$C" || true

      - name: Hard gate — fail early if boot/vermagic config drifted
        working-directory: kernel
        run: |
          set -euo pipefail
          C=out/.config
          grep -q '^CONFIG_LOCALVERSION="-perf"' "$C" || { echo "FATAL: LOCALVERSION wrong"; exit 1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' "$C" || { echo "FATAL: LOCALVERSION_AUTO on"; exit 1; }
          grep -q '^# CONFIG_KSU_MANUAL_HOOK is not set' "$C" || { echo "FATAL: MANUAL_HOOK not off"; exit 1; }
          for e in CONFIG_KSU CONFIG_KPROBES CONFIG_KRETPROBES CONFIG_KSU_KPROBES_HOOK \
                   CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD \
                   CONFIG_TASKSTATS CONFIG_KALLSYMS_ALL; do
            grep -q "^${e}=y" "$C" || { echo "FATAL: ${e} not =y (device option must be preserved)"; exit 1; }
          done
          # LTO must be OFF (bootable-first; LTO+clang was the failure source).
          if grep -q '^CONFIG_LTO_CLANG=y' "$C"; then echo "FATAL: LTO_CLANG still on (must be off)"; exit 1; fi
          # susfs must be entirely gone
          if grep -q 'CONFIG_KSU_SUSFS' "$C"; then echo "FATAL: susfs symbol in .config"; exit 1; fi
          echo "Boot/vermagic/KSN config gate OK (LTO off)"

      - name: Prepare scripts and headers
        working-directory: ./kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            scripts prepare

      - name: Build kernel (apt clang-18, ld.lld-18, LTO off)
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export KBUILD_BUILD_USER=ci
          export KBUILD_BUILD_HOST=github

          # Final safety re-resolve
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          # Verify device options that #6 wrongly disabled are STILL on
          for s in CONFIG_TASKSTATS CONFIG_TRANSPARENT_HUGEPAGE; do
            grep -q "^${s}=y" out/.config || echo "WARN: ${s} not =y"
          done
          # LTO is intentionally off here (bootable-first); confirm for the log.
          grep -q '^# CONFIG_LTO_CLANG is not set' out/.config && echo "LTO off (as intended)" || echo "WARN: LTO not explicitly off"

          make -j"$(nproc)" ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          # LineageOS sm8150 builds an appended Image.gz-dtb (dtb glued on).
          ls -lah out/arch/arm64/boot/ || true
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/
          fi
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../AnyKernel3/
          fi
          test -f ../AnyKernel3/Image.gz-dtb || test -f ../AnyKernel3/Image \
            || { echo "FATAL: no kernel image produced"; exit 1; }

      - name: Show vermagic base
        working-directory: kernel
        run: |
          echo "==== kernel.release (vermagic base, expect 4.14.356-perf) ===="
          cat out/include/config/kernel.release || true

      - name: Build Wi-Fi Module (qca_cld3, in-tree, matching vermagic)
        working-directory: ./kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            modules_prepare
          make -j"$(nproc)" ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M=drivers/staging/qcacld-3.0 modules || \
          make -j"$(nproc)" ARCH=arm64 O=out LLVM=1 LLVM_IAS=0 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M=drivers/staging/qca-wifi-host-cmn modules || true

          mkdir -p ../modules/vendor/lib/modules
          find out -name "*.ko" -path "*qca*" -exec cp -v {} ../modules/vendor/lib/modules/ \; || true
          echo "==== wlan.ko vermagic (must match kernel: 4.14.356-perf ... modversions) ===="
          for ko in ../modules/vendor/lib/modules/*.ko; do
            [ -f "$ko" ] || continue
            echo "--- $ko ---"
            /sbin/modinfo "$ko" 2>/dev/null | grep -i vermagic || strings "$ko" | grep -m1 'SMP preempt' || true
          done

      - name: Package Kernel (AnyKernel3)
        run: |
          set -euo pipefail
          cd AnyKernel3
          zip -r "../${OUTPUT_ZIP_NAME}.zip" *
          cd ..

      - name: Package Wi-Fi Module
        continue-on-error: true
        run: |
          if ls modules/vendor/lib/modules/*.ko >/dev/null 2>&1; then
            cd modules
            zip -r "../${OUTPUT_ZIP_NAME}-modules.zip" *
            cd ..
          else
            echo "No Wi-Fi modules produced (kernel still shippable; stock wlan.ko may load if vermagic matches)."
          fi

      - name: Upload kernel build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            kernel/out/.config
            kernel/out/include/config/kernel.release
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
          if-no-files-found: warn

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            ${{ env.OUTPUT_ZIP_NAME }}.zip
            ${{ env.OUTPUT_ZIP_NAME }}-modules.zip
          if-no-files-found: warn
